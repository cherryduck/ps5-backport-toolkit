# Test + build on Linux and Windows. Pushes to master also publish a GitHub release, but only
# when the version in ps5bp/__init__.py has no tag yet (bump the version to release).
name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "0"            # test the real Windows default (ANSI code page), not UTF-8 mode

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[gui,dev]"
      - run: python -m pytest -q -rfE --tb=short

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04          # oldest supported runner -> lowest glibc floor for the bundle
            asset: linux-x86_64
          - os: windows-latest
            asset: windows-x64
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - id: ver
        shell: bash
        run: echo "version=$(python -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("ps5bp/__init__.py").read())[1])')" >> "$GITHUB_OUTPUT"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[gui]" pyinstaller
      - run: python -m PyInstaller --clean --noconfirm --distpath dist --workpath build packaging/ps5bp.spec
      - name: Smoke test the bundle
        shell: bash
        run: |
          set -e
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          dist/ps5bp/ps5bp$exe --version
          dist/ps5bp/ps5bp$exe --help > /dev/null
          dist/ps5bp/ps5bp$exe rules > /dev/null          # loads every rule module (numpy, capstone)
          python packaging/smoke_gui.py "dist/ps5bp/ps5bp-gui$exe"
      - name: Package
        id: pkg
        shell: bash
        run: |
          set -e
          name="ps5bp-${{ steps.ver.outputs.version }}-${{ matrix.asset }}"
          mv dist/ps5bp "dist/$name"
          cp README.md LICENSE "dist/$name/"
          [ "$RUNNER_OS" = Linux ] && cp scripts/install-desktop.sh "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip -mx=9 "$name.zip" "$name" > /dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ steps.pkg.outputs.file }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # tags + history for the notes
      - name: Already released?
        id: check
        env:
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists - bump __version__ in ps5bp/__init__.py to release. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.skip == 'false'
        with:
          path: assets
          merge-multiple: true
      - name: Release notes
        if: steps.check.outputs.skip == 'false'
        env:
          TAG: v${{ needs.build.outputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
        run: python .github/release_notes.py "$TAG" "$VERSION" > notes.md && cat notes.md
      - name: Publish
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          set -e
          cd assets && sha256sum * > SHA256SUMS && cd ..
          gh release create "$TAG" assets/* --target "$GITHUB_SHA" \
            --title "PS5 Backport Toolkit $TAG" --notes-file notes.md

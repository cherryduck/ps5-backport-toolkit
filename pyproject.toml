[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5bp"
dynamic = ["version"]                 # single source: ps5bp/__init__.py __version__
description = "Analyze and backport PS5 game dumps to older firmware"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["capstone>=5", "numpy"]

[project.optional-dependencies]
gui = ["PyQt6"]
dev = ["pytest", "unicorn"]

[project.scripts]
ps5bp = "ps5bp.cli:main"
ps5bp-gui = "ps5bp.gui:main"

[tool.setuptools.dynamic]
version = {attr = "ps5bp.__version__"}

[project.urls]
Homepage = "https://github.com/cherryduck/ps5-backport-toolkit"

[tool.setuptools.packages.find]
include = ["ps5bp*"]

[tool.setuptools.package-data]
ps5bp = ["data/*", "data/recipes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
